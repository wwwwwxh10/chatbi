<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatBI 组件库</title>
    <script src="./vendor/echarts.min.js"></script>
    <script src="./vendor/echarts-liquidfill.min.js"></script>
    <style>
      :root {
        --bg: #03060c;
        --bg-a: rgba(45, 100, 255, 0.18);
        --bg-b: rgba(121, 54, 255, 0.12);
        --bg-c: rgba(20, 255, 185, 0.08);
        --panel: rgba(10, 16, 30, 0.85);
        --panel-border: rgba(120, 160, 255, 0.25);
        --panel-glow: rgba(90, 140, 255, 0.12);
        --text: rgba(245, 248, 255, 0.95);
        --muted: rgba(160, 180, 210, 0.7);
        --border: rgba(120, 160, 255, 0.18);
        --accent: #5e9bff;
        --accent-2: #7c3aed;
        --accent-3: #22d3ee;
        --glow: rgba(90, 140, 255, 0.4);
        --card-bg: linear-gradient(135deg, rgba(20, 30, 50, 0.6), rgba(10, 15, 25, 0.8));
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft Yahei", sans-serif;
        font-size: 14px;
        background: radial-gradient(1200px 700px at 30% 10%, var(--bg-a), transparent 55%),
          radial-gradient(900px 520px at 80% 30%, var(--bg-b), transparent 55%),
          radial-gradient(1200px 900px at 60% 120%, var(--bg-c), transparent 60%),
          var(--bg);
        color: var(--text);
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.03),
            rgba(255, 255, 255, 0.03) 1px,
            transparent 1px,
            transparent 22px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.03),
            rgba(255, 255, 255, 0.03) 1px,
            transparent 1px,
            transparent 22px
          );
        opacity: 0.18;
        mask-image: radial-gradient(circle at 40% 20%, rgba(0, 0, 0, 1), transparent 70%);
      }

      .layout {
        display: grid;
        grid-template-columns: 260px 1fr;
        height: 100vh;
      }

      .sidebar {
        background: linear-gradient(180deg, rgba(10, 14, 28, 0.70), rgba(8, 10, 18, 0.55));
        border-right: 1px solid var(--border);
        backdrop-filter: blur(10px);
        padding: 20px 14px;
        overflow: auto;
      }

      .sidebar::-webkit-scrollbar {
        width: 6px;
      }

      .sidebar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.02);
        border-radius: 10px;
      }

      .sidebar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.00);
        border-radius: 10px;
        border: 2px solid rgba(0, 0, 0, 0);
        background-clip: padding-box;
      }

      .sidebar:hover::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.10);
        border: 2px solid rgba(0, 0, 0, 0);
        background-clip: padding-box;
      }

      .sidebar {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.12) rgba(255, 255, 255, 0.02);
      }

      .logo {
        font-weight: 700;
        font-size: 18px;
        margin-bottom: 16px;
        letter-spacing: 0.5px;
      }

      .nav-group {
        margin: 16px 0 8px;
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0.8;
      }

      .nav-item {
        padding: 10px 12px;
        margin: 6px 0;
        border-radius: 8px;
        cursor: pointer;
        background: transparent;
        color: var(--text);
        border: 1px solid transparent;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
      }

      .nav-item:hover {
        background: rgba(120, 160, 255, 0.06);
        border-color: rgba(120, 160, 255, 0.12);
      }

      .nav-item.active {
        background: linear-gradient(90deg, rgba(120, 160, 255, 0.14), rgba(120, 160, 255, 0.04));
        border-color: rgba(120, 160, 255, 0.18);
        color: #fff;
        box-shadow: 0 0 0 1px rgba(120, 160, 255, 0.06);
      }

      .nav-icon {
        width: 18px;
        height: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: rgba(225, 236, 255, 0.85);
        flex: 0 0 18px;
      }

      .nav-icon svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.95;
      }

      .main {
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 12px;
        padding: 16px;
        overflow: hidden;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: var(--panel);
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        backdrop-filter: blur(10px);
        box-shadow: 0 0 0 1px rgba(120, 160, 255, 0.06), 0 18px 40px rgba(0, 0, 0, 0.28);
        position: relative;
        z-index: 30;
        overflow: visible;
      }

      .top-left {
        position: absolute;
        left: 14px;
        display: none;
      }

      .top-right {
        position: absolute;
        right: 14px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .theme-bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .theme-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        cursor: pointer;
        background: rgba(8, 12, 22, 0.5);
        box-shadow: 0 0 0 1px rgba(120, 160, 255, 0.05) inset;
        user-select: none;
      }

      .theme-btn.active {
        outline: 2px solid var(--accent);
        box-shadow: 0 0 0 1px rgba(120, 160, 255, 0.08) inset, 0 0 22px var(--glow);
      }

      .swatches {
        display: flex;
        gap: 4px;
      }

      .swatch {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .content {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        height: 100%;
        overflow: hidden;
      }

      .panel {
        background: rgba(10, 16, 30, 0.45);
        border: 1px solid var(--panel-border);
        border-radius: 4px;
        padding: 24px;
        min-height: 580px;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        backdrop-filter: blur(20px);
        box-shadow: 0 0 30px var(--panel-glow), 0 40px 80px rgba(0, 0, 0, 0.5);
        position: relative;
        z-index: 1;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
      }

      .panel::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: 
          linear-gradient(to right, var(--accent) 12px, transparent 12px) 0 0 / 100% 2px,
          linear-gradient(to bottom, var(--accent) 12px, transparent 12px) 0 0 / 2px 100%,
          linear-gradient(to left, var(--accent) 12px, transparent 12px) 100% 0 / 100% 2px,
          linear-gradient(to bottom, var(--accent) 12px, transparent 12px) 100% 0 / 2px 100%,
          linear-gradient(to right, var(--accent) 12px, transparent 12px) 0 100% / 100% 2px,
          linear-gradient(to top, var(--accent) 12px, transparent 12px) 0 100% / 2px 100%,
          linear-gradient(to left, var(--accent) 12px, transparent 12px) 100% 100% / 100% 2px,
          linear-gradient(to top, var(--accent) 12px, transparent 12px) 100% 100% / 2px 100%;
        background-repeat: no-repeat;
        opacity: 0.8;
        z-index: 5;
      }

      .panel::after {
        content: "";
        position: absolute;
        inset: 4px;
        pointer-events: none;
        border: 1px solid rgba(120, 160, 255, 0.08);
        background: 
          linear-gradient(90deg, rgba(120, 160, 255, 0.03) 1px, transparent 1px) 0 0 / 20px 100%,
          linear-gradient(0deg, rgba(120, 160, 255, 0.03) 1px, transparent 1px) 0 0 / 100% 20px;
        opacity: 0.4;
      }

      .panel-glow-line {
        position: absolute;
        inset: -1px;
        border-radius: 4px;
        padding: 1px;
        background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), var(--accent-3), transparent);
        background-size: 220% 100%;
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask-composite: exclude;
        pointer-events: none;
        animation: borderFlow 4s linear infinite;
        opacity: 0.45;
        z-index: 2;
      }

      .panel-glow-line::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 4px;
        pointer-events: none;
        box-shadow: 0 0 26px rgba(90, 140, 255, 0.28), 0 0 60px rgba(124, 58, 237, 0.16);
        opacity: 0.9;
      }

      @keyframes borderFlow {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

      .chart-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        position: relative;
        z-index: 2;
      }

      .chart-title-area {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .chart-title-icon {
        width: 24px;
        height: 24px;
        background: transparent;
        border: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
        opacity: 0.9;
      }

      .chart-title-icon svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
      }

      .lang-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.05);
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid var(--border);
        cursor: pointer;
        transition: all 0.2s;
        color: var(--muted);
      }

      .lang-toggle:hover {
        background: rgba(120, 160, 255, 0.1);
        border-color: var(--accent);
        color: var(--accent);
      }

      .lang-text {
        font-size: 11px;
        font-weight: 700;
        margin-left: 0;
        text-transform: uppercase;
      }

      .toggle-group {
        display: flex;
        background: rgba(255, 255, 255, 0.04);
        padding: 3px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .toggle-btn {
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 11px;
        cursor: pointer;
        color: var(--muted);
        transition: all 0.2s;
      }

      .toggle-btn.active {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 2px 8px var(--glow);
      }

      .chart-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 4px;
        letter-spacing: 0.2px;
        color: var(--text);
      }

      .chart-subtitle {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 10px;
      }

      #chart {
        width: 100%;
        flex: 1;
        min-height: 400px;
      }

      .palette-pop {
        position: absolute;
        top: calc(100% + 12px);
        right: 0;
        width: 280px;
        background: rgba(8, 12, 22, 0.94);
        border: 1px solid rgba(120, 160, 255, 0.25);
        border-radius: 12px;
        padding: 12px;
        backdrop-filter: blur(20px);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), 0 0 30px rgba(90, 140, 255, 0.2);
        display: none;
        z-index: 9999;
      }

      .palette-pop.open {
        display: block;
      }

      .palette-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 10px;
      }

      .palette-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(8, 12, 22, 0.5);
        cursor: pointer;
        user-select: none;
      }

      .palette-btn:hover {
        border-color: rgba(120, 160, 255, 0.28);
      }

      .palette {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }

      .palette .swatch {
        height: 22px;
        width: 100%;
        border-radius: 6px;
        position: relative;
      }

      .palette .swatch span {
        position: absolute;
        bottom: 2px;
        right: 4px;
        font-size: 9px;
        color: #fff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }

      .indicator-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        margin-bottom: 10px;
      }

      .indicator-grid.cols-1 {
        grid-template-columns: 1fr;
      }

      .card {
        position: relative;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(120, 160, 255, 0.12);
        border-radius: 10px;
        padding: 20px;
        min-height: 110px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        overflow: hidden;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
      }

      .card:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: var(--accent);
        box-shadow: 0 0 15px var(--glow);
        transform: translateY(-2px);
      }

      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        position: relative;
        z-index: 1;
      }

      .card-icon {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(120, 160, 255, 0.08);
        border: 1px solid rgba(120, 160, 255, 0.15);
        color: var(--accent);
      }

      .card-icon svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
      }

      .badge-row {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        position: relative;
        z-index: 1;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
        color: rgba(245, 248, 255, 0.82);
        font-size: 12px;
        white-space: nowrap;
      }

      .status-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.10);
        background: rgba(255, 255, 255, 0.05);
        font-size: 12px;
        color: rgba(245, 248, 255, 0.86);
        white-space: nowrap;
      }

      .status-chip .pill {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #22c55e;
        box-shadow: 0 0 14px rgba(34, 197, 94, 0.45);
      }

      .status-chip.bad {
        border-color: rgba(239, 68, 68, 0.22);
        background: rgba(239, 68, 68, 0.08);
      }

      .status-chip.bad .pill {
        background: #ef4444;
        box-shadow: 0 0 14px rgba(239, 68, 68, 0.45);
      }

      .badge .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 12px var(--glow);
      }

      .flip-display {
        display: inline-flex;
        align-items: flex-end;
        gap: 1px;
        font-family: ui-monospace, Menlo, Monaco, Consolas, "SF Mono", "Roboto Mono", monospace;
        font-variant-numeric: tabular-nums;
        letter-spacing: 1px;
      }

      .flip-col {
        position: relative;
        width: 14px;
        height: 26px;
        overflow: hidden;
        border-radius: 0;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .flip-stack {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        transition: transform 420ms cubic-bezier(0.2, 0.9, 0.2, 1);
      }

      .flip-digit {
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        line-height: 26px;
        color: rgba(245, 248, 255, 0.92);
      }

      .flip-static {
        height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
        font-size: 18px;
        color: rgba(245, 248, 255, 0.85);
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 12px;
        background: radial-gradient(600px 120px at 20% 0%, rgba(90, 140, 255, 0.22), transparent 60%);
        pointer-events: none;
      }

      .card .label {
        font-size: 12px;
        color: var(--muted);
      }

      .card .value {
        font-size: 20px;
        font-weight: 700;
        margin-top: 6px;
      }

      .value-row {
        display: inline-flex;
        align-items: baseline;
        gap: 10px;
      }

      .delta {
        font-size: 12px;
        font-weight: 600;
        opacity: 0.9;
        letter-spacing: 0.2px;
      }

      .flip {
        font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
        letter-spacing: 2px;
      }

      .missing {
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(239, 68, 68, 0.12);
        color: #fecaca;
        margin-top: 10px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="logo">ChatBI组件库</div>
        <div id="nav"></div>
      </aside>
      <main class="main">
        <section class="topbar">
          <div class="top-left">
            <div class="top-title">ChatBI组件库</div>
            <div class="top-sub" id="topSub">主题/图表可切换</div>
          </div>
          <div class="theme-bar" id="themeBar"></div>
          <div class="top-right">
            <div class="palette-btn" id="paletteBtn">
              <div class="swatches" id="palettePreview"></div>
              <div style="color: var(--muted); font-size: 12px">色卡</div>
              <div class="palette-pop" id="palettePop">
                <div class="palette-head">
                  <div id="paletteTitle">主题色卡</div>
                  <div style="opacity: 0.8">点击外部关闭</div>
                </div>
                <div class="palette" id="paletteBox"></div>
              </div>
            </div>
            <div class="lang-toggle" id="langToggle" title="Switch Language">
              <span class="lang-text" id="langText">英文</span>
            </div>
          </div>
        </section>
        <section class="content">
          <div class="panel">
            <div class="panel-glow-line"></div>
            <div class="chart-header">
              <div class="chart-title-area">
                <div class="chart-title-icon" id="chartTitleIcon"></div>
                <div>
                  <div class="chart-title" id="chartTitle"></div>
                  <div class="chart-subtitle" id="chartSubTitle"></div>
                </div>
              </div>
              <div id="chartControls"></div>
            </div>
            <div id="indicatorArea" style="display: none">
              <div class="indicator-grid" id="indicatorGrid"></div>
            </div>
            <div id="chart"></div>
            <div id="missingDeps" class="missing" style="display: none"></div>
          </div>
        </section>
      </main>
    </div>

    <script>
      const themes = {
        cyber: {
          name: "赛博蓝紫",
          nameEn: "Cyber Blue",
          colors: [
            "#6AA6FF",
            "#7C3AED",
            "#22D3EE",
            "#A855F7",
            "#38BDF8",
            "#34D399",
            "#F472B6",
            "#93C5FD",
            "#14B8A6",
            "#C4B5FD",
          ],
        },
        aurora: {
          name: "极光青绿",
          nameEn: "Aurora Green",
          colors: [
            "#2DD4BF",
            "#22D3EE",
            "#34D399",
            "#4ADE80",
            "#10B981",
            "#38BDF8",
            "#A7F3D0",
            "#86EFAC",
            "#5EEAD4",
            "#84CC16",
          ],
        },
        ember: {
          name: "霓虹熔金",
          nameEn: "Ember Gold",
          colors: [
            "#F97316",
            "#F59E0B",
            "#F43F5E",
            "#FB7185",
            "#F472B6",
            "#A855F7",
            "#FDBA74",
            "#FDE047",
            "#C084FC",
            "#60A5FA",
          ],
        },
      }

      const UI_TEXT = "rgba(245, 248, 255, 0.92)"
      const UI_MUTED = "rgba(189, 203, 227, 0.65)"

      const groups = [
        {
          group: "指标",
          items: [
            { key: "indicator", name: "指标卡" },
            { key: "flip", name: "翻牌器" },
            { key: "gauge", name: "仪表盘" },
            { key: "progress", name: "进度条" },
            { key: "water", name: "水波图" },
          ],
        },
        {
          group: "线图",
          items: [
            { key: "line", name: "折线图" },
            { key: "smooth", name: "曲线图" },
            { key: "area", name: "面积图" },
          ],
        },
        {

      function formatFlipValue(value, prefix, suffix) {
        if (typeof value === "number") {
          const isFloat = String(value).includes(".")
          const v = isFloat ? value.toFixed(1) : Math.round(value).toString()
          const withSep = v.replace(/\B(?=(\d{3})+(?!\d))/g, ",")
          return `${prefix || ""}${withSep}${suffix || ""}`
        }
        return `${prefix || ""}${String(value)}${suffix || ""}`
      }

      function setFlipDisplay(el, text) {
        el.innerHTML = ""
        const wrap = document.createElement("span")
        wrap.className = "flip-display"
        const chars = String(text).split("")
        chars.forEach((ch) => {
          if (/[0-9]/.test(ch)) {
            const col = document.createElement("span")
            col.className = "flip-col"
            col.dataset.kind = "digit"
            col.dataset.digit = ch

            const stack = document.createElement("span")
            stack.className = "flip-stack"
            for (let i = 0; i <= 9; i += 1) {
              const d = document.createElement("span")
              d.className = "flip-digit"
              d.textContent = String(i)
              stack.appendChild(d)
            }
            col.appendChild(stack)
            wrap.appendChild(col)
          } else {
            const s = document.createElement("span")
            s.className = "flip-static"
            s.dataset.kind = "static"
            s.textContent = ch
            wrap.appendChild(s)
          }
        })
        el.appendChild(wrap)
        updateFlipDisplay(el, text, true)
      }

      function updateFlipDisplay(el, text, immediate = false) {
        const wrap = el.querySelector(".flip-display")
        if (!wrap) return setFlipDisplay(el, text)
        const next = String(text)
        const currSignature = Array.from(wrap.children)
          .map((n) => (n.dataset.kind === "digit" ? "d" : `s:${n.textContent}`))
          .join("|")
        const nextSignature = next
          .split("")
          .map((ch) => (/[0-9]/.test(ch) ? "d" : `s:${ch}`))
          .join("|")
        if (currSignature !== nextSignature) return setFlipDisplay(el, text)

        const digits = next.split("").filter((ch) => /[0-9]/.test(ch))
        let di = 0
        Array.from(wrap.children).forEach((node) => {
          if (node.dataset.kind !== "digit") return
          const d = digits[di] || "0"
          di += 1
          node.dataset.digit = d
          const stack = node.querySelector(".flip-stack")
          if (!stack) return
          if (immediate) stack.style.transition = "none"
          stack.style.transform = `translateY(${-Number(d) * 26}px)`
          if (immediate) {
            requestAnimationFrame(() => {
              stack.style.transition = "transform 420ms cubic-bezier(0.2, 0.9, 0.2, 1)"
            })
          }
        })
      }

      let flipTimer = null

      function startFlipAnimation(theme) {
        if (flipTimer) {
          clearInterval(flipTimer)
          flipTimer = null
        }

        const state = [
          { id: "flip-0", value: 840219, step: [80, 320], prefix: "¥", suffix: "" },
          { id: "flip-1", value: 1924, step: [2, 12], prefix: "", suffix: "" },
          { id: "flip-2", value: 214, step: [0, 2], prefix: "", suffix: "" },
          { id: "flip-3", value: 87, step: [0, 1], prefix: "", suffix: "" },
          { id: "flip-4", value: 99.8, step: [-0.1, 0.1], prefix: "", suffix: "%" },
        ]

        flipTimer = setInterval(() => {
          state.forEach((s) => {
            const el = document.getElementById(s.id)
            if (!el) return
            const [minStep, maxStep] = s.step
            const delta = minStep + Math.random() * (maxStep - minStep)
            if (s.id === "flip-4") {
              s.value = Math.max(98.5, Math.min(99.99, s.value + delta))
              s.value = Math.round(s.value * 10) / 10
            } else {
              s.value = Math.max(0, Math.round(s.value + delta))
            }
            updateFlipDisplay(el, formatFlipValue(s.value, s.prefix, s.suffix))
          })
        }, 1000)
      }

      function hexToRgb(hex) {
        const cleaned = (hex || "").replace("#", "").trim()
        if (cleaned.length !== 6) return null
        const r = parseInt(cleaned.slice(0, 2), 16)
        const g = parseInt(cleaned.slice(2, 4), 16)
        const b = parseInt(cleaned.slice(4, 6), 16)
        if (Number.isNaN(r) || Number.isNaN(g) || Number.isNaN(b)) return null
        return { r, g, b }
      }

      function withAlpha(hex, alpha) {
        const rgb = hexToRgb(hex)
        if (!rgb) return hex
        return `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${alpha})`
      }

      function formatWithUnit(value, unit) {
        if (!unit) return String(value)
        if (Array.isArray(value)) return value.map((v) => `${v}${unit}`).join(", ")
        return `${value}${unit}`
      }
